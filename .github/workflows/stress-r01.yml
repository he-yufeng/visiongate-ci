name: Frozen300case label-isolated stress R01
on:
  push:
    branches: [pilot/stress-holdout-20261006-r01]
    paths: [tools/stress_generator.py, tools/predict_stress.py, tools/native_stress.py, STRESS_PROTOCOL_R01.md, STRESS_SOURCE_MANIFEST.json, .github/workflows/stress-r01.yml]
permissions:
  contents: read
concurrency:
  group: stress-r01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps --require-hashes -r cv5-requirements.txt
      - name: One complete stress evaluation without label-driven fitting
        run: python -B tools/native_stress.py

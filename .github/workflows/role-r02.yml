name: Frozen role-capture paired300case R02
on:
  push:
    branches: [pilot/role-policy-20261006-r02]
    paths: [visiongate_ci/role_agent.py, contracts/role_policy_r02.json, tools/role_stress_generator.py, tools/predict_roles.py, tools/role_controls.py, tools/native_roles.py, ROLE_PROTOCOL_R02.md, ROLE_SOURCE_MANIFEST.json, .github/workflows/role-r02.yml]
permissions:
  contents: read
concurrency:
  group: role-r02-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps --require-hashes -r cv5-requirements.txt
      - name: Execute new native controls then one fresh paired evaluation
        run: python -B tools/native_roles.py

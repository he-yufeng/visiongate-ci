name: Frozen owned-web live-capture R03 integration
on:
  push:
    branches: [pilot/live-browser-20261006-r03]
    paths: [browser/playwright-cli.json, tools/browser_cli.sh, tools/owned_web_fixtures.py, tools/live_browser_adapter.py, tools/predict_browser.py, tools/native_browser.py, BROWSER_PROTOCOL_R03.md, BROWSER_SOURCE_MANIFEST.json, package.json, package-lock.json, .github/workflows/browser-r03.yml]
permissions:
  contents: read
concurrency:
  group: browser-r03-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: command -v npx && command -v google-chrome
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --no-deps --require-hashes -r cv5-requirements.txt
      - name: One owned-page live capture and DOM role integration
        run: python -B tools/native_browser.py
